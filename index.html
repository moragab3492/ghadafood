<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكلات غادة للأكل البيتي</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdenjIK9hihgVKoBIuqSIbCDbWbaf9png",
            authDomain: "ghada-food.firebaseapp.com",
            projectId: "ghada-food",
            storageBucket: "ghada-food.firebasestorage.app",
            messagingSenderId: "159787065325",
            appId: "1:159787065325:web:c346c60c30c8e27e0551e4"
        };

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.firebaseAPI = {
            onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
            collection, addDoc, doc, setDoc, onSnapshot, query, orderBy, updateDoc, deleteDoc
        };
    </script>
</head>
<body class="bg-orange-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
            doc, setDoc, collection, addDoc, onSnapshot, query, orderBy, updateDoc, deleteDoc
        } = window.firebaseAPI;

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [username, setUsername] = useState("");

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(window.auth, (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        setIsAdmin(currentUser.email === "ghada@ghada.com");
                        // استخراج اسم المستخدم من الإيميل
                        setUsername(currentUser.email.split('@')[0]);
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) return <div className="flex items-center justify-center min-h-screen text-teal-600 font-bold text-xl">جاري التحميل...</div>;

            return user ? (
                isAdmin ? <AdminDashboard user={user} /> : <CustomerDashboard user={user} username={username} />
            ) : <Login />;
        }

        function Login() {
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [isRegister, setIsRegister] = useState(false);
            const [error, setError] = useState("");
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError("");
                setLoading(true);
                
                const email = username.trim().toLowerCase() + "@ghada.com";
                let pass = password;
                
                if (username === "ghada" && password === "19991") {
                    pass = "19991_admin"; 
                } else if (password.length < 6) {
                    setError("كلمة المرور للعملاء يجب أن تكون 6 أحرف أو أرقام على الأقل");
                    setLoading(false);
                    return;
                }

                try {
                    if (isRegister && username !== "ghada") {
                        const userCredential = await createUserWithEmailAndPassword(window.auth, email, pass);
                        await setDoc(doc(window.db, "app_users", userCredential.user.uid), {
                            username: username, role: "customer", createdAt: new Date().toISOString()
                        });
                    } else {
                        await signInWithEmailAndPassword(window.auth, email, pass);
                    }
                } catch (err) {
                    if (err.code === "auth/email-already-in-use") setError("هذا الاسم مسجل بالفعل، يرجى تسجيل الدخول.");
                    else setError("البيانات غير صحيحة، تأكد من الاسم وكلمة المرور.");
                }
                setLoading(false);
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-4">
                    <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm border-t-4 border-teal-500">
                        <h2 className="text-2xl font-bold text-teal-700 mb-2 text-center">أكلات غادة 🍲</h2>
                        <h3 className="text-gray-500 mb-6 text-center text-sm">{isRegister ? "إنشاء حساب كعميل جديد" : "تسجيل الدخول للمتابعة"}</h3>
                        {error && <p className="text-red-500 text-sm mb-4 text-center font-bold bg-red-50 p-2 rounded">{error}</p>}
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-gray-700 mb-1 font-medium">اسم المستخدم</label>
                                <input type="text" required value={username} onChange={(e) => setUsername(e.target.value)}
                                    className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="اكتب اسمك هنا" />
                            </div>
                            <div>
                                <label className="block text-gray-700 mb-1 font-medium">كلمة المرور</label>
                                <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="******" />
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-teal-600 text-white py-2 rounded-lg hover:bg-teal-700 transition font-bold">
                                {loading ? "جاري التحميل..." : (isRegister ? "إنشاء الحساب" : "تسجيل الدخول")}
                            </button>
                        </form>
                        <button onClick={() => {setIsRegister(!isRegister); setError("");}} className="w-full text-sm text-teal-600 mt-4 hover:underline font-medium">
                            {isRegister ? "لديك حساب بالفعل؟ سجل دخولك" : "ليس لديك حساب؟ أنشئ حساباً كعميل"}
                        </button>
                    </div>
                </div>
            );
        }

        function AdminDashboard({ user }) {
            const [products, setProducts] = useState([]);
            const [orders, setOrders] = useState([]);
            const [name, setName] = useState("");
            const [price, setPrice] = useState("");
            const [desc, setDesc] = useState("");

            // جلب المنتجات والطلبات
            useEffect(() => {
                const qProducts = query(collection(window.db, "products"), orderBy("createdAt", "desc"));
                const unsubProducts = onSnapshot(qProducts, (snapshot) => {
                    setProducts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const qOrders = query(collection(window.db, "orders"), orderBy("createdAt", "desc"));
                const unsubOrders = onSnapshot(qOrders, (snapshot) => {
                    setOrders(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                return () => { unsubProducts(); unsubOrders(); };
            }, []);

            const handleAddProduct = async (e) => {
                e.preventDefault();
                if(!name || !price) return;
                await addDoc(collection(window.db, "products"), {
                    name, price: Number(price), desc, createdAt: new Date().toISOString()
                });
                setName(""); setPrice(""); setDesc("");
            };

            const handleDeleteProduct = async (id) => {
                if(confirm("هل أنت متأكد من حذف هذه الأكلة؟")) {
                    await deleteDoc(doc(window.db, "products", id));
                }
            };

            const handleCompleteOrder = async (id) => {
                await updateDoc(doc(window.db, "orders", id), { status: "مكتمل" });
            };

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto">
                    <div className="flex justify-between items-center mb-6 border-b pb-4">
                        <h1 className="text-2xl font-bold text-teal-700">لوحة الإدارة 👩‍🍳</h1>
                        <button onClick={() => signOut(window.auth)} className="bg-red-50 text-red-600 hover:bg-red-100 px-4 py-2 rounded-lg font-bold transition">خروج</button>
                    </div>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        {/* قسم الطلبات */}
                        <div>
                            <h2 className="text-xl font-bold mb-4 text-gray-800 flex items-center gap-2">
                                🔔 الطلبات الحالية ({orders.filter(o => o.status === "قيد التجهيز").length})
                            </h2>
                            <div className="space-y-4">
                                {orders.length === 0 ? <p className="text-gray-500">لا توجد طلبات حتى الآن...</p> : null}
                                {orders.map(order => (
                                    <div key={order.id} className={`p-4 rounded-lg shadow border-r-4 ${order.status === "مكتمل" ? "bg-gray-50 border-gray-400 opacity-75" : "bg-white border-orange-500"}`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <h3 className="font-bold text-teal-800 text-lg">العميل: {order.customerName}</h3>
                                            <span className={`px-2 py-1 rounded text-xs font-bold ${order.status === "مكتمل" ? "bg-gray-200 text-gray-600" : "bg-orange-100 text-orange-600"}`}>
                                                {order.status}
                                            </span>
                                        </div>
                                        <ul className="text-sm text-gray-600 mb-3 space-y-1">
                                            {order.items.map((item, idx) => (
                                                <li key={idx}>- {item.name} <span className="text-orange-500 font-bold">({item.price} ج)</span></li>
                                            ))}
                                        </ul>
                                        <div className="flex justify-between items-center border-t pt-2 mt-2">
                                            <span className="font-bold text-gray-800">الإجمالي: {order.totalPrice} ج</span>
                                            {order.status !== "مكتمل" && (
                                                <button onClick={() => handleCompleteOrder(order.id)} className="bg-teal-600 text-white px-4 py-1 rounded hover:bg-teal-700 font-medium text-sm">
                                                    إنهاء الطلب ✓
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* قسم المنيو وإضافة المنتجات */}
                        <div>
                            <div className="bg-white p-6 rounded-lg shadow mb-6 border-t-4 border-teal-500">
                                <h2 className="text-lg font-bold mb-4 text-gray-800">إضافة أكلة جديدة</h2>
                                <form onSubmit={handleAddProduct} className="flex flex-col gap-3">
                                    <input type="text" placeholder="اسم الأكلة" required value={name} onChange={e => setName(e.target.value)} className="px-4 py-2 border rounded-lg focus:ring-2 outline-none" />
                                    <input type="number" placeholder="السعر" required value={price} onChange={e => setPrice(e.target.value)} className="px-4 py-2 border rounded-lg focus:ring-2 outline-none" />
                                    <input type="text" placeholder="تفاصيل (اختياري)" value={desc} onChange={e => setDesc(e.target.value)} className="px-4 py-2 border rounded-lg focus:ring-2 outline-none" />
                                    <button type="submit" className="bg-teal-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-teal-700">إضافة للمنيو</button>
                                </form>
                            </div>

                            <h2 className="text-lg font-bold mb-4 text-gray-800">المنيو ({products.length})</h2>
                            <div className="space-y-3">
                                {products.map(p => (
                                    <div key={p.id} className="bg-white p-3 rounded-lg shadow flex justify-between items-center border-r-4 border-teal-500">
                                        <div>
                                            <h3 className="font-bold text-teal-800">{p.name}</h3>
                                            <p className="text-gray-500 text-xs">{p.desc}</p>
                                        </div>
                                        <div className="flex items-center gap-4">
                                            <span className="font-bold text-orange-600">{p.price} ج</span>
                                            <button onClick={() => handleDeleteProduct(p.id)} className="text-red-500 hover:text-red-700 font-bold text-xl">×</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function CustomerDashboard({ user, username }) {
            const [products, setProducts] = useState([]);
            const [cart, setCart] = useState([]);
            const [sending, setSending] = useState(false);

            useEffect(() => {
                const q = query(collection(window.db, "products"), orderBy("createdAt", "desc"));
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    setProducts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => unsubscribe();
            }, []);

            const addToCart = (product) => {
                setCart([...cart, product]);
            };

            const removeFromCart = (indexToRemove) => {
                setCart(cart.filter((_, index) => index !== indexToRemove));
            };

            const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

            const handleCheckout = async () => {
                if (cart.length === 0) return;
                setSending(true);
                try {
                    await addDoc(collection(window.db, "orders"), {
                        userId: user.uid,
                        customerName: username,
                        items: cart,
                        totalPrice: totalPrice,
                        status: "قيد التجهيز",
                        createdAt: new Date().toISOString()
                    });
                    setCart([]);
                    alert("تم إرسال طلبك بنجاح لغادة! 🍲");
                } catch (error) {
                    alert("حدث خطأ أثناء إرسال الطلب.");
                }
                setSending(false);
            };

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto">
                    <div className="flex justify-between items-center mb-6 border-b pb-4">
                        <h1 className="text-2xl font-bold text-orange-600">أكلات غادة 🍲</h1>
                        <div className="flex gap-4 items-center">
                            <span className="font-bold text-teal-700 hidden md:inline">أهلاً، {username}</span>
                            <button onClick={() => signOut(window.auth)} className="bg-red-50 text-red-600 hover:bg-red-100 px-4 py-2 rounded-lg font-bold transition text-sm">خروج</button>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* المنيو */}
                        <div className="lg:col-span-2">
                            <h2 className="text-xl font-bold mb-4 text-gray-800">المنيو الطازج اليوم</h2>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                {products.length === 0 ? <p className="text-gray-500">جاري تجهيز الأكلات...</p> : null}
                                {products.map(p => (
                                    <div key={p.id} className="bg-white p-4 rounded-lg shadow flex flex-col justify-between border-t-4 border-teal-500">
                                        <div className="mb-4">
                                            <h3 className="font-bold text-lg text-teal-800">{p.name}</h3>
                                            <p className="text-gray-500 text-sm h-8 overflow-hidden">{p.desc}</p>
                                        </div>
                                        <div className="flex justify-between items-center mt-auto">
                                            <span className="text-xl font-bold text-orange-600">{p.price} ج</span>
                                            <button onClick={() => addToCart(p)} className="bg-teal-50 text-teal-700 px-4 py-2 rounded-lg font-bold hover:bg-teal-100 transition">
                                                أضف للسلة +
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* السلة */}
                        <div className="bg-white p-6 rounded-lg shadow h-fit border-t-4 border-orange-500 sticky top-8">
                            <h2 className="text-xl font-bold mb-4 text-gray-800 flex items-center justify-between">
                                <span>سلة طلباتي 🛒</span>
                                <span className="bg-orange-100 text-orange-600 px-2 py-1 rounded text-sm">{cart.length}</span>
                            </h2>
                            
                            {cart.length === 0 ? (
                                <p className="text-gray-500 text-center py-8">السلة فارغة، اختار أكلتك المفضلة من المنيو!</p>
                            ) : (
                                <div className="space-y-4">
                                    <ul className="space-y-2 max-h-64 overflow-y-auto pr-2">
                                        {cart.map((item, index) => (
                                            <li key={index} className="flex justify-between items-center bg-gray-50 p-2 rounded">
                                                <span className="text-sm font-medium">{item.name}</span>
                                                <div className="flex items-center gap-3">
                                                    <span className="text-orange-600 font-bold text-sm">{item.price} ج</span>
                                                    <button onClick={() => removeFromCart(index)} className="text-red-400 hover:text-red-600 font-bold text-lg">×</button>
                                                </div>
                                            </li>
                                        ))}
                                    </ul>
                                    <div className="border-t pt-4">
                                        <div className="flex justify-between items-center mb-4 text-lg font-bold text-gray-800">
                                            <span>الإجمالي:</span>
                                            <span>{totalPrice} جنيه</span>
                                        </div>
                                        <button onClick={handleCheckout} disabled={sending} className="w-full bg-orange-500 text-white py-3 rounded-lg font-bold hover:bg-orange-600 transition shadow-lg">
                                            {sending ? "جاري الإرسال..." : "اطلب الآن 🚀"}
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
