<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكلات غادة للأكل البيتي</title>
    
    <!-- استدعاء Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- استدعاء React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- إعدادات Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ استبدل هذا الجزء بالكود الخاص بك من Firebase
        const firebaseConfig = {
            apiKey: "ضع_الكود_هنا",
            authDomain: "ضع_الكود_هنا",
            projectId: "ضع_الكود_هنا",
            storageBucket: "ضع_الكود_هنا",
            messagingSenderId: "ضع_الكود_هنا",
            appId: "ضع_الكود_هنا"
        };

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
    </script>
</head>
<body class="bg-orange-50 font-sans">
    <div id="root"></div>

    <!-- كود React الأساسي -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            return (
                <div className="flex flex-col items-center justify-center min-h-screen">
                    <div className="bg-white p-8 rounded-xl shadow-lg text-center max-w-sm w-full border-t-4 border-teal-500">
                        <h1 className="text-3xl font-bold text-teal-700 mb-2">أكلات غادة</h1>
                        <p className="text-orange-500 font-medium mb-6">اللي تتمناه وزيادة 🍲</p>
                        <p className="text-gray-600 text-sm">جاري تجهيز واجهة تسجيل الدخول...</p>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
