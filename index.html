<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكلات غادة للأكل البيتي</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, updateDoc, deleteDoc, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdenjIK9hihgVKoBIuqSIbCDbWbaf9png",
            authDomain: "ghada-food.firebaseapp.com",
            projectId: "ghada-food",
            storageBucket: "ghada-food.firebasestorage.app",
            messagingSenderId: "159787065325",
            appId: "1:159787065325:web:c346c60c30c8e27e0551e4"
        };

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.firebaseAPI = {
            onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
            collection, addDoc, doc, setDoc, onSnapshot, query, orderBy, updateDoc, deleteDoc, where
        };
    </script>
</head>
<body class="bg-orange-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
            doc, setDoc, collection, addDoc, onSnapshot, query, orderBy, updateDoc, deleteDoc, where
        } = window.firebaseAPI;

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [username, setUsername] = useState("");

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(window.auth, (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        setIsAdmin(currentUser.email === "ghada@ghada.com");
                        setUsername(currentUser.email.split('@')[0]);
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) return <div className="flex items-center justify-center min-h-screen text-teal-600 font-bold text-xl">جاري التحميل...</div>;

            return user ? (
                isAdmin ? <AdminDashboard user={user} /> : <CustomerDashboard user={user} username={username} />
            ) : <Login />;
        }

        // --- واجهة تسجيل الدخول ---
        function Login() {
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [isRegister, setIsRegister] = useState(false);
            const [error, setError] = useState("");
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError(""); setLoading(true);
                const email = username.trim().toLowerCase() + "@ghada.com";
                let pass = password;
                
                if (username === "ghada" && password === "19991") pass = "19991_admin"; 
                else if (password.length < 6) { setError("كلمة المرور 6 أحرف أو أرقام على الأقل"); setLoading(false); return; }

                try {
                    if (isRegister && username !== "ghada") {
                        const userCredential = await createUserWithEmailAndPassword(window.auth, email, pass);
                        await setDoc(doc(window.db, "app_users", userCredential.user.uid), { username, role: "customer", createdAt: new Date().toISOString() });
                    } else {
                        await signInWithEmailAndPassword(window.auth, email, pass);
                    }
                } catch (err) {
                    setError("البيانات غير صحيحة، أو الحساب مسجل بالفعل.");
                }
                setLoading(false);
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-4">
                    <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm border-t-4 border-teal-500">
                        <h2 className="text-2xl font-bold text-teal-700 mb-2 text-center">أكلات غادة 🍲</h2>
                        <h3 className="text-gray-500 mb-6 text-center text-sm">{isRegister ? "إنشاء حساب عميل" : "تسجيل الدخول"}</h3>
                        {error && <p className="text-red-500 text-sm mb-4 text-center font-bold bg-red-50 p-2 rounded">{error}</p>}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input type="text" required value={username} onChange={(e) => setUsername(e.target.value)} className="w-full px-4 py-2 border rounded-lg focus:ring-teal-500 outline-none" placeholder="اسم المستخدم" />
                            <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-2 border rounded-lg focus:ring-teal-500 outline-none" placeholder="كلمة المرور" />
                            <button type="submit" disabled={loading} className="w-full bg-teal-600 text-white py-2 rounded-lg font-bold">{loading ? "جاري..." : (isRegister ? "إنشاء الحساب" : "دخول")}</button>
                        </form>
                        <button onClick={() => {setIsRegister(!isRegister); setError("");}} className="w-full text-sm text-teal-600 mt-4 font-medium">{isRegister ? "سجل دخولك" : "أنشئ حساباً كعميل"}</button>
                    </div>
                </div>
            );
        }

        // --- لوحة الإدارة ---
        function AdminDashboard({ user }) {
            const [products, setProducts] = useState([]);
            const [orders, setOrders] = useState([]);
            const [name, setName] = useState("");
            const [price, setPrice] = useState("");
            const [desc, setDesc] = useState("");
            const [imageUrl, setImageUrl] = useState(""); // حقل الصورة الجديد

            useEffect(() => {
                const unsubProducts = onSnapshot(query(collection(window.db, "products"), orderBy("createdAt", "desc")), (snapshot) => {
                    setProducts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubOrders = onSnapshot(query(collection(window.db, "orders"), orderBy("createdAt", "desc")), (snapshot) => {
                    setOrders(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => { unsubProducts(); unsubOrders(); };
            }, []);

            const handleAddProduct = async (e) => {
                e.preventDefault();
                if(!name || !price) return;
                await addDoc(collection(window.db, "products"), {
                    name, price: Number(price), desc, imageUrl, createdAt: new Date().toISOString()
                });
                setName(""); setPrice(""); setDesc(""); setImageUrl("");
            };

            const handleDeleteProduct = async (id) => {
                if(confirm("حذف هذه الأكلة؟")) await deleteDoc(doc(window.db, "products", id));
            };

            const handleCompleteOrder = async (id) => {
                await updateDoc(doc(window.db, "orders", id), { status: "مكتمل" });
            };

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto">
                    <div className="flex justify-between items-center mb-6 border-b pb-4">
                        <h1 className="text-2xl font-bold text-teal-700">لوحة الإدارة 👩‍🍳</h1>
                        <button onClick={() => signOut(window.auth)} className="bg-red-50 text-red-600 px-4 py-2 rounded-lg font-bold">خروج</button>
                    </div>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div>
                            <h2 className="text-xl font-bold mb-4 text-gray-800">الطلبات ({orders.filter(o => o.status === "قيد التجهيز").length})</h2>
                            <div className="space-y-4">
                                {orders.map(order => (
                                    <div key={order.id} className={`p-4 rounded-lg shadow border-r-4 ${order.status === "مكتمل" ? "bg-gray-50 border-gray-400" : "bg-white border-orange-500"}`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <h3 className="font-bold text-teal-800">{order.customerName}</h3>
                                            <span className="px-2 py-1 rounded text-xs font-bold bg-gray-200">{order.status}</span>
                                        </div>
                                        <ul className="text-sm text-gray-600 mb-2">
                                            {order.items.map((item, idx) => <li key={idx}>- {item.name}</li>)}
                                        </ul>
                                        <div className="flex justify-between items-center border-t pt-2">
                                            <span className="font-bold">{order.totalPrice} ج</span>
                                            {order.status !== "مكتمل" ? (
                                                <button onClick={() => handleCompleteOrder(order.id)} className="bg-teal-600 text-white px-3 py-1 rounded text-sm">إنهاء الطلب ✓</button>
                                            ) : (
                                                order.rating && <span className="text-yellow-500 font-bold">التقييم: {order.rating} ⭐</span>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div>
                            <div className="bg-white p-6 rounded-lg shadow mb-6 border-t-4 border-teal-500">
                                <h2 className="text-lg font-bold mb-4">إضافة أكلة</h2>
                                <form onSubmit={handleAddProduct} className="flex flex-col gap-3">
                                    <input type="text" placeholder="اسم الأكلة" required value={name} onChange={e => setName(e.target.value)} className="px-4 py-2 border rounded-lg" />
                                    <input type="number" placeholder="السعر" required value={price} onChange={e => setPrice(e.target.value)} className="px-4 py-2 border rounded-lg" />
                                    <input type="text" placeholder="تفاصيل (اختياري)" value={desc} onChange={e => setDesc(e.target.value)} className="px-4 py-2 border rounded-lg" />
                                    <input type="url" placeholder="رابط صورة للمنتج (اختياري)" value={imageUrl} onChange={e => setImageUrl(e.target.value)} className="px-4 py-2 border rounded-lg" dir="ltr" />
                                    <button type="submit" className="bg-teal-600 text-white px-4 py-2 rounded-lg font-bold">إضافة للمنيو</button>
                                </form>
                            </div>

                            <div className="space-y-3">
                                {products.map(p => (
                                    <div key={p.id} className="bg-white p-3 rounded-lg shadow flex justify-between items-center border-r-4 border-teal-500">
                                        <div className="flex gap-3 items-center">
                                            {p.imageUrl && <img src={p.imageUrl} alt={p.name} className="w-12 h-12 rounded object-cover" />}
                                            <div>
                                                <h3 className="font-bold text-teal-800">{p.name}</h3>
                                                <p className="text-gray-500 text-xs">{p.price} ج</p>
                                            </div>
                                        </div>
                                        <button onClick={() => handleDeleteProduct(p.id)} className="text-red-500 font-bold text-xl">×</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- لوحة العميل ---
        function CustomerDashboard({ user, username }) {
            const [products, setProducts] = useState([]);
            const [cart, setCart] = useState([]);
            const [myOrders, setMyOrders] = useState([]);
            const [sending, setSending] = useState(false);

            useEffect(() => {
                const unsubProducts = onSnapshot(query(collection(window.db, "products"), orderBy("createdAt", "desc")), (snapshot) => {
                    setProducts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                // جلب طلبات العميل الحالي فقط
                const unsubOrders = onSnapshot(query(collection(window.db, "orders"), where("userId", "==", user.uid)), (snapshot) => {
                    // ترتيب الطلبات برمجياً لتجنب مشاكل فهارس فايربيز
                    const ordersData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setMyOrders(ordersData.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)));
                });
                return () => { unsubProducts(); unsubOrders(); };
            }, [user.uid]);

            const addToCart = (product) => setCart([...cart, product]);
            const removeFromCart = (idx) => setCart(cart.filter((_, i) => i !== idx));
            const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

            const handleCheckout = async () => {
                if (cart.length === 0) return;
                setSending(true);
                try {
                    await addDoc(collection(window.db, "orders"), {
                        userId: user.uid, customerName: username, items: cart, totalPrice, status: "قيد التجهيز", createdAt: new Date().toISOString()
                    });
                    setCart([]); alert("تم إرسال طلبك بنجاح!");
                } catch (error) { alert("حدث خطأ."); }
                setSending(false);
            };

            const handleRate = async (orderId, ratingValue) => {
                await updateDoc(doc(window.db, "orders", orderId), { rating: ratingValue });
            };

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto">
                    <div className="flex justify-between items-center mb-6 border-b pb-4">
                        <h1 className="text-2xl font-bold text-orange-600">أكلات غادة 🍲</h1>
                        <button onClick={() => signOut(window.auth)} className="bg-red-50 text-red-600 px-4 py-2 rounded-lg font-bold text-sm">خروج</button>
                    </div>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* قسم المنيو */}
                        <div className="lg:col-span-2">
                            <h2 className="text-xl font-bold mb-4 text-gray-800">المنيو الطازج اليوم</h2>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                {products.map(p => (
                                    <div key={p.id} className="bg-white p-4 rounded-lg shadow flex flex-col border-t-4 border-teal-500 overflow-hidden">
                                        {p.imageUrl && <img src={p.imageUrl} alt={p.name} className="w-full h-40 object-cover rounded-t-md mb-3" />}
                                        <div className="flex-1">
                                            <h3 className="font-bold text-lg text-teal-800">{p.name}</h3>
                                            <p className="text-gray-500 text-sm mb-4">{p.desc}</p>
                                        </div>
                                        <div className="flex justify-between items-center mt-auto border-t pt-3">
                                            <span className="text-xl font-bold text-orange-600">{p.price} ج</span>
                                            <button onClick={() => addToCart(p)} className="bg-teal-50 text-teal-700 px-3 py-1 rounded-lg font-bold">أضف للسلة</button>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* طلباتي السابقة (للتقييم) */}
                            {myOrders.length > 0 && (
                                <div className="mt-8 border-t pt-6">
                                    <h2 className="text-xl font-bold mb-4 text-gray-800">طلباتي السابقة</h2>
                                    <div className="space-y-3">
                                        {myOrders.map(order => (
                                            <div key={order.id} className="bg-white p-4 rounded-lg shadow flex justify-between items-center">
                                                <div>
                                                    <p className="font-bold text-teal-800">طلب بـ {order.totalPrice} ج</p>
                                                    <p className="text-sm text-gray-500">حالة الطلب: {order.status}</p>
                                                </div>
                                                {order.status === "مكتمل" && !order.rating && (
                                                    <div className="flex gap-1">
                                                        {[1,2,3,4,5].map(star => (
                                                            <button key={star} onClick={() => handleRate(order.id, star)} className="text-2xl text-gray-300 hover:text-yellow-500 transition">★</button>
                                                        ))}
                                                    </div>
                                                )}
                                                {order.rating && <span className="text-yellow-500 font-bold text-lg">قيّمت بـ {order.rating} ★</span>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* قسم السلة */}
                        <div className="bg-white p-6 rounded-lg shadow h-fit border-t-4 border-orange-500 sticky top-8">
                            <h2 className="text-xl font-bold mb-4 flex justify-between"><span>سلة طلباتي 🛒</span> <span className="text-orange-600">{cart.length}</span></h2>
                            {cart.length === 0 ? <p className="text-gray-500 text-center py-8">السلة فارغة</p> : (
                                <div>
                                    <ul className="space-y-2 mb-4">
                                        {cart.map((item, idx) => (
                                            <li key={idx} className="flex justify-between items-center bg-gray-50 p-2 rounded">
                                                <span className="text-sm">{item.name}</span>
                                                <button onClick={() => removeFromCart(idx)} className="text-red-400 font-bold">×</button>
                                            </li>
                                        ))}
                                    </ul>
                                    <div className="border-t pt-4 font-bold text-lg flex justify-between mb-4"><span>الإجمالي:</span> <span>{totalPrice} ج</span></div>
                                    <button onClick={handleCheckout} disabled={sending} className="w-full bg-orange-500 text-white py-3 rounded-lg font-bold">{sending ? "جاري..." : "اطلب الآن 🚀"}</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
